<!-- =========================================================================
     4. TEXTURE FILTERS. All inline, no libraries, fragment-only refs so they
     work from file:// as well as http://
     ========================================================================= -->
<svg class="defs" aria-hidden="true" focusable="false" width="0" height="0">
  <defs>
    <!-- 4.3 xerox: posterise after the CSS grayscale/contrast pass -->
    <filter id="f-xerox" color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncR type="discrete" tableValues="0 .14 .3 .46 .62 .8 1"/>
        <feFuncG type="discrete" tableValues="0 .14 .3 .46 .62 .8 1"/>
        <feFuncB type="discrete" tableValues="0 .14 .3 .46 .62 .8 1"/>
      </feComponentTransfer>
    </filter>

    <!-- 4.4 torn edge: turbulence displacing the source, used on scraps -->
    <filter id="f-torn" x="-6%" y="-6%" width="112%" height="112%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.09" numOctaves="4" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="13" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- 4.4 deckle: the same trick, softer, for the postcard front -->
    <filter id="f-deckle" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.11" numOctaves="3" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- 4.4 tape: a rougher tear for the two tape strips -->
    <filter id="f-tape" x="-10%" y="-30%" width="120%" height="160%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.06 0.22" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
