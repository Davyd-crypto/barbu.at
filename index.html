<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>David Barbu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Scrollable document setup for any screen height */
    html {
      background: #ffffff;
      min-height: 100%;
    }

    body {
      background: #ffffff;
      color: #000000;
      font-family: "VT323", monospace;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(1.5rem, 4vw, 3.5rem);
      image-rendering: pixelated;
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
    }

    .top-bar {
      font-size: clamp(1.2rem, 1.6vw, 1.5rem);
      letter-spacing: 0.1em;
      opacity: 0.55;
    }

    /* Balanced layout with avatar shifted inward towards center */
    .content-container {
      margin: 2.5rem 0;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      align-items: center;
      justify-items: center;
      gap: clamp(2rem, 4vw, 4.5rem);
      position: relative;
      width: 100%;
    }

    main {
      width: 100%;
    }

    .prompt {
      font-size: clamp(1.4rem, 2vw, 2rem);
      opacity: 0.45;
      margin-bottom: 0.4rem;
      letter-spacing: 0.05em;
    }

    h1 {
      font-size: clamp(4rem, 9.5vw, 9.5rem);
      font-weight: 400;
      line-height: 0.88;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .subtitle {
      font-size: clamp(1.6rem, 2.6vw, 2.6rem);
      line-height: 1.18;
      max-width: 28ch;
      margin-bottom: 1.5rem;
    }

    .cursor {
      display: inline-block;
      width: 0.6em;
      height: 0.9em;
      background: #000000;
      vertical-align: -0.05em;
      animation: blink 1s step-start infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    /* Tilted, floating daemon avatar */
    .avatar-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      user-select: none;
      cursor: pointer;
      flex-shrink: 0;
      animation: floatTilted 3.8s ease-in-out infinite;
      transform-origin: center center;
    }

    @keyframes floatTilted {
      0%, 100% {
        transform: rotate(-4deg) translateY(0px) scale(1);
      }
      50% {
        transform: rotate(-2.5deg) translateY(-16px) scale(1.02);
      }
    }

    .avatar-wrapper.bobbing {
      animation: bounceTilted 0.45s cubic-bezier(0.28, 0.84, 0.42, 1) 2;
    }

    .avatar-wrapper.shiver {
      animation: glitchTilted 0.22s steps(2, start) 3;
    }

    @keyframes bounceTilted {
      0%, 100% { transform: rotate(-4deg) translateY(0) scale(1); }
      40% { transform: rotate(-5deg) translateY(-22px) scale(0.96, 1.06); }
      70% { transform: rotate(-3deg) translateY(4px) scale(1.04, 0.94); }
    }

    @keyframes glitchTilted {
      0% { transform: rotate(-4deg) translate(-4px, 3px); }
      25% { transform: rotate(-2deg) translate(4px, -3px); }
      50% { transform: rotate(-5deg) translate(-3px, -4px); }
      75% { transform: rotate(-3deg) translate(3px, 4px); }
      100% { transform: rotate(-4deg) translate(0, 0); }
    }

    .avatar-box {
      border: 4px solid #000000;
      background: #ffffff;
      padding: clamp(1.8rem, 3.2vw, 2.8rem);
      box-shadow: 10px 10px 0px #000000;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .avatar-wrapper:hover .avatar-box {
      transform: translate(-3px, -3px);
      box-shadow: 13px 13px 0px #000000;
    }

    .avatar-wrapper:active .avatar-box {
      transform: translate(4px, 4px);
      box-shadow: 5px 5px 0px #000000;
    }

    .avatar-box::before {
      content: "[DAEMON]";
      position: absolute;
      top: -15px;
      left: 16px;
      background: #ffffff;
      padding: 0 8px;
      font-size: 1.2rem;
      letter-spacing: 0.1em;
    }

    .pixel-face-canvas {
      width: clamp(180px, 22vw, 260px);
      height: clamp(180px, 22vw, 260px);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
    }

    .avatar-status {
      font-size: clamp(1.2rem, 1.6vw, 1.5rem);
      letter-spacing: 0.08em;
      opacity: 0.65;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
      font-size: clamp(1.3rem, 1.8vw, 1.8rem);
      border-top: 3px solid #000000;
      padding-top: 1.5rem;
      letter-spacing: 0.08em;
    }

    .links {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
    }

    a {
      color: #000000;
      text-decoration: none;
      border-bottom: 2px solid transparent;
      text-transform: uppercase;
    }

    a:hover {
      border-bottom: 2px solid #000000;
    }

    /* Touch & Desktop Interactive Exit Button */
    .exit-btn {
      font-family: inherit;
      font-size: inherit;
      background: transparent;
      color: #000000;
      border: 2px solid #000000;
      padding: 4px 12px;
      cursor: pointer;
      user-select: none;
      opacity: 0.75;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.1s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .exit-btn:hover {
      opacity: 1;
      background: #000000;
      color: #ffffff;
    }

    .exit-btn:active {
      transform: translate(2px, 2px);
    }

    /* CRT Power-Off Animation */
    body.shutting-down {
      animation: crtTurnOff 0.75s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      pointer-events: none;
    }

    @keyframes crtTurnOff {
      0% { transform: scale(1, 1); filter: brightness(1); opacity: 1; }
      35% { transform: scale(1, 0.005); filter: brightness(2) contrast(2); opacity: 1; }
      70% { transform: scale(0.12, 0.005); filter: brightness(3); opacity: 0.9; }
      100% { transform: scale(0, 0); filter: brightness(0); opacity: 0; }
    }

    /* CRT Power-On Animation */
    body.powering-on {
      animation: crtTurnOn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      pointer-events: none;
    }

    @keyframes crtTurnOn {
      0% { transform: scale(0, 0); filter: brightness(3) contrast(2); opacity: 0; }
      30% { transform: scale(0.15, 0.005); filter: brightness(3) contrast(2); opacity: 1; }
      60% { transform: scale(1, 0.005); filter: brightness(2); opacity: 1; }
      80% { transform: scale(1, 1.05); filter: brightness(1.4); opacity: 1; }
      100% { transform: scale(1, 1); filter: brightness(1); opacity: 1; }
    }

    /* Blackout / SIGINT screen */
    .terminal-killed {
      position: fixed;
      inset: 0;
      background: #000000;
      color: #ffffff;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.75rem;
      padding: 1.5rem;
      text-align: center;
      font-size: clamp(1.3rem, 2.5vw, 2.5rem);
      letter-spacing: 0.08em;
      z-index: 9999;
      user-select: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .terminal-killed.active {
      display: flex;
    }

    .terminal-killed span {
      opacity: 0.5;
      font-size: clamp(1rem, 1.5vw, 1.3rem);
    }

    /* Responsive adjustments for phones */
    @media (max-width: 860px) {
      body {
        padding: 1.5rem;
      }

      .content-container {
        grid-template-columns: 1fr;
        justify-items: center;
        gap: 2.5rem;
        margin: 2rem 0;
      }

      .avatar-wrapper {
        order: 2;
      }

      main {
        order: 1;
      }

      footer {
        flex-direction: column-reverse;
        align-items: flex-start;
        gap: 1.25rem;
        margin-top: 1rem;
      }

      .exit-btn {
        width: 100%;
        justify-content: center;
        padding: 8px 16px;
      }
    }
  </style>
</head>
<body>

  <header class="top-bar">
    [TTY1] // 200_OK // ROOT_SESSION
  </header>

  <div class="content-container">
    <main>
      <div class="prompt">guest@db:~# whoami</div>
      <h1>David Barbu</h1>
      <p class="subtitle">
        Frontend-heavy Engineer with full-stack instincts & years of shipping production code.<span class="cursor"></span>
      </p>
    </main>

    <div class="avatar-wrapper" id="avatar-container" title="Tap or interact">
      <div class="avatar-box">
        <canvas class="pixel-face-canvas" id="faceCanvas" width="16" height="16"></canvas>
      </div>
      <div class="avatar-status" id="avatar-status">&gt; idle</div>
    </div>
  </div>

  <footer>
    <nav class="links">
      <a href="mailto:dbarbu03@gmail.com">email</a>
      <a href="https://github.com/Davyd-crypto" target="_blank" rel="noreferrer">github</a>
      <a href="https://www.linkedin.com/in/david-barbu-7a84ab264/" target="_blank" rel="noreferrer">linkedin</a>
    </nav>
    <button class="exit-btn" id="exit-btn" aria-label="Terminate session">[EXIT / ^C]</button>
  </footer>

  <div class="terminal-killed" id="killed-screen">
    <div>[PROCESS TERMINATED: SIGINT (exit code 130)]</div>
    <span>TAP ANYWHERE OR PRESS ANY KEY TO RECONNECT</span>
  </div>

  <script>
    /* Shutdown & Reconnect logic */
    let isTerminating = false;
    const killedScreen = document.getElementById('killed-screen');

    function triggerShutdown() {
      if (isTerminating) return;
      isTerminating = true;

      setFaceState('dead', 'killed');
      document.body.classList.remove('powering-on');
      document.body.classList.add('shutting-down');

      setTimeout(() => {
        killedScreen.classList.add('active');
        document.body.classList.remove('shutting-down');
      }, 750);
    }

    function triggerReconnect() {
      if (!isTerminating || !killedScreen.classList.contains('active')) return;

      killedScreen.classList.remove('active');
      document.body.classList.add('powering-on');
      setFaceState('cheer', 'online');

      setTimeout(() => {
        document.body.classList.remove('powering-on');
        isTerminating = false;
        resetToIdle();
      }, 800);
    }

    // Keyboard support: Ctrl+C / Cmd+C / any key reconnect
    window.addEventListener('keydown', (e) => {
      if (isTerminating && killedScreen.classList.contains('active')) {
        triggerReconnect();
        return;
      }

      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') {
        if (!window.getSelection().toString()) {
          e.preventDefault();
          triggerShutdown();
        }
      }
    });

    // Touch & Click support for Exit & Reconnect
    document.getElementById('exit-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      triggerShutdown();
    });

    killedScreen.addEventListener('click', triggerReconnect);
    killedScreen.addEventListener('touchend', (e) => {
      e.preventDefault();
      triggerReconnect();
    });

    /* Pixel Sprite Matrix (16x16) */

    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('avatar-status');

    let currentSprite = 'idle';
    let isBusy = false;
    let idleTimer = null;
    let sequenceTimeout = null;

    function drawSprite(spriteKey) {
      const sprite = SPRITES[spriteKey] || SPRITES.idle;
      ctx.clearRect(0, 0, 16, 16);
      ctx.fillStyle = '#000000';

      for (let y = 0; y < 16; y++) {
        const row = sprite[y];
        for (let x = 0; x < 16; x++) {
          if (row[x] === '#') {
            ctx.fillRect(x, y, 1, 1);
          }
        }
      }
    }

    function setFaceState(spriteKey, statusText) {
      currentSprite = spriteKey;
      drawSprite(spriteKey);
      statusEl.textContent = `> ${statusText}`;
    }

    function resetToIdle() {
      if (isTerminating) return;
      avatarContainer.classList.remove('bobbing', 'shiver');
      isBusy = false;
      setFaceState('idle', 'idle');
    }

    setFaceState('idle', 'idle');

    /* Routine Engine */
    function runRoutineEngine() {
      if (isTerminating) return;

      const routineDelay = Math.floor(Math.random() * 2600) + 1800;

      idleTimer = setTimeout(() => {
        if (!isBusy && !isTerminating) {
          executeRandomBehaviors();
        }
        runRoutineEngine();
      }, routineDelay);
    }

    function executeRandomBehaviors() {
      const roll = Math.random();

      if (roll < 0.35) {
        setFaceState('blink', 'blink');
        setTimeout(() => {
          setFaceState('idle', 'idle');
          if (Math.random() > 0.6) {
            setTimeout(() => {
              setFaceState('blink', 'blink');
              setTimeout(resetToIdle, 110);
            }, 90);
          }
        }, 110);
      } else if (roll < 0.50) {
        setFaceState('wink', 'wink ;)');
        setTimeout(resetToIdle, 400);
      } else if (roll < 0.75) {
        const glances = [
          { s: 'look_left', l: 'scan_l' },
          { s: 'look_right', l: 'scan_r' },
          { s: 'look_up', l: 'daydream' },
          { s: 'look_down', l: 'inspect' },
          { s: 'side_eye', l: 'side_eye' }
        ];
        const g = glances[Math.floor(Math.random() * glances.length)];
        setFaceState(g.s, g.l);
        setTimeout(() => {
          if (Math.random() > 0.5) {
            const alt = g.s === 'look_left' ? 'look_right' : 'look_left';
            setFaceState(alt, 'scan_opp');
            setTimeout(resetToIdle, 450);
          } else {
            resetToIdle();
          }
        }, 650);
      } else if (roll < 0.90) {
        setFaceState('thinking', 'computing');
        setTimeout(() => {
          if (Math.random() > 0.5) {
            setFaceState('noticed', 'idea!');
            avatarContainer.classList.add('bobbing');
            setTimeout(resetToIdle, 600);
          } else {
            resetToIdle();
          }
        }, 850);
      } else {
        setFaceState('sleepy', 'yawn');
        setTimeout(() => {
          setFaceState('blink', 'drowsy');
          setTimeout(resetToIdle, 400);
        }, 800);
      }
    }

    runRoutineEngine();

    /* Touch & Click Interaction */
    let tapCount = 0;
    function handleAvatarTap(e) {
      if (isTerminating) return;
      isBusy = true;
      clearTimeout(sequenceTimeout);
      tapCount++;

      if (tapCount % 3 === 1) {
        setFaceState('noticed', 'poke!');
        avatarContainer.classList.add('bobbing');
      } else if (tapCount % 3 === 2) {
        setFaceState('gasp', 'woah!');
        avatarContainer.classList.add('shiver');
      } else {
        setFaceState('cheer', 'yay!');
        avatarContainer.classList.add('bobbing');
      }

      sequenceTimeout = setTimeout(() => {
        resetToIdle();
      }, 1000);
    }

    avatarContainer.addEventListener('click', handleAvatarTap);
    avatarContainer.addEventListener('mouseenter', () => {
      if (isTerminating) return;
      isBusy = true;
      clearTimeout(sequenceTimeout);
      setFaceState('cheer', 'happy_hello');
      avatarContainer.classList.add('bobbing');
    });

    avatarContainer.addEventListener('mouseleave', () => {
      if (isTerminating) return;
      clearTimeout(sequenceTimeout);
      resetToIdle();
    });

    /* Pointer Tracking */
    let moveThrottle = false;
    window.addEventListener('mousemove', (e) => {
      if (isBusy || isTerminating || moveThrottle) return;
      moveThrottle = true;
      setTimeout(() => { moveThrottle = false; }, 70);

      const rect = avatarContainer.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      const dx = e.clientX - cx;
      const dy = e.clientY - cy;
      const dist = Math.hypot(dx, dy);

      if (dist < 420) {
        if (Math.abs(dx) > Math.abs(dy)) {
          if (dx < -70) setFaceState('look_left', 'watching_l');
          else if (dx > 70) setFaceState('look_right', 'watching_r');
        } else {
          if (dy < -70) setFaceState('look_up', 'watching_u');
          else if (dy > 70) setFaceState('look_down', 'watching_d');
        }
      } else {
        if (['look_left', 'look_right', 'look_up', 'look_down'].includes(currentSprite)) {
          resetToIdle();
        }
      }
    });
